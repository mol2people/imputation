[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cohort-allocator"
version = "0.1.0"
description = "Deterministic OR-Tools allocation of participant cohorts into balanced folds"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ortools>=9.10",
  "pandas>=2.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]

[project.scripts]
cohort-allocate = "cohort_allocator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
