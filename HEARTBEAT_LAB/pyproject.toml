[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heartbeat-lab"
version = "0.1.0"
description = "A readable epoch-HR classification case study"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scikit-learn>=1.5", "joblib>=1.3", "numba>=0.60", "torch", "tqdm"]

[project.optional-dependencies]
demo = ["streamlit>=1.40", "jupyterlab", "matplotlib", "pyarrow"]

[tool.setuptools.packages.find]
where = ["src"]
